# ApplyPilot search configuration
# Priority 1: remote full-time roles in the United States and Canada.
# Priority 2: remote part-time roles across Europe, with Norway searched first.
#
# A listing is excluded only when it explicitly requires existing local work
# authorization or says that visa sponsorship is unavailable. Ambiguous
# listings remain available for manual eligibility review.

defaults:
  distance: 0
  hours_old: 72
  results_per_site: 50

sites:
  - indeed
  - linkedin
  - zip_recruiter

locations:
  - label: "US Remote"
    location: "United States"
    remote: true
    job_type: "fulltime"
    country_indeed: "usa"
  - label: "Canada Remote"
    location: "Canada"
    remote: true
    job_type: "fulltime"
    country_indeed: "canada"
  - label: "Norway Part-Time Remote"
    location: "Norway"
    remote: true
    job_type: "parttime"
    country_indeed: "norway"
  - label: "Sweden Part-Time Remote"
    location: "Sweden"
    remote: true
    job_type: "parttime"
    country_indeed: "sweden"
  - label: "Denmark Part-Time Remote"
    location: "Denmark"
    remote: true
    job_type: "parttime"
    country_indeed: "denmark"
  - label: "Finland Part-Time Remote"
    location: "Finland"
    remote: true
    job_type: "parttime"
    country_indeed: "finland"
  - label: "Germany Part-Time Remote"
    location: "Germany"
    remote: true
    job_type: "parttime"
    country_indeed: "germany"
  - label: "Netherlands Part-Time Remote"
    location: "Netherlands"
    remote: true
    job_type: "parttime"
    country_indeed: "netherlands"
  - label: "Ireland Part-Time Remote"
    location: "Ireland"
    remote: true
    job_type: "parttime"
    country_indeed: "ireland"
  - label: "United Kingdom Part-Time Remote"
    location: "United Kingdom"
    remote: true
    job_type: "parttime"
    country_indeed: "united kingdom"
  - label: "France Part-Time Remote"
    location: "France"
    remote: true
    job_type: "parttime"
    country_indeed: "france"
  - label: "Spain Part-Time Remote"
    location: "Spain"
    remote: true
    job_type: "parttime"
    country_indeed: "spain"
  - label: "Portugal Part-Time Remote"
    location: "Portugal"
    remote: true
    job_type: "parttime"
    country_indeed: "portugal"
  - label: "Italy Part-Time Remote"
    location: "Italy"
    remote: true
    job_type: "parttime"
    country_indeed: "italy"

# Remote jobs are always retained. These patterns only permit non-remote jobs
# in the European fallback regions.
location_accept:
  - "norway"
  - "norge"
  - "sweden"
  - "denmark"
  - "finland"
  - "germany"
  - "netherlands"
  - "ireland"
  - "united kingdom"
  - "uk"
  - "france"
  - "spain"
  - "portugal"
  - "italy"
  - "italia"
  - "europe"
  - "emea"
location_reject_non_remote: []

queries:
  - query: "Backend Engineer"
    tier: 1
    location_labels: ["US Remote", "Canada Remote"]
  - query: "Full Stack Developer"
    tier: 1
    location_labels: ["US Remote", "Canada Remote"]
  - query: "Software Engineer"
    tier: 1
    location_labels: ["US Remote", "Canada Remote"]
  - query: "Python Developer"
    tier: 1
    location_labels: ["US Remote", "Canada Remote"]
  - query: "Part Time Backend Engineer"
    tier: 2
    location_labels: &europe_part_time_locations
      - "Norway Part-Time Remote"
      - "Sweden Part-Time Remote"
      - "Denmark Part-Time Remote"
      - "Finland Part-Time Remote"
      - "Germany Part-Time Remote"
      - "Netherlands Part-Time Remote"
      - "Ireland Part-Time Remote"
      - "United Kingdom Part-Time Remote"
      - "France Part-Time Remote"
      - "Spain Part-Time Remote"
      - "Portugal Part-Time Remote"
      - "Italy Part-Time Remote"
  - query: "Part Time Full Stack Developer"
    tier: 2
    location_labels: *europe_part_time_locations
  - query: "Part Time Software Engineer"
    tier: 2
    location_labels: *europe_part_time_locations

# Workday searches tier 1-2 queries against the configured employer registry.
workday_max_tier: 2
workday_location_filter: true

# Skip jobs only when the listing explicitly says a local work authorisation
# or an employer-sponsored visa is mandatory/unavailable. This cannot confirm
# immigration eligibility; always verify the full listing before applying.
exclude_description_patterns:
  - "no visa sponsorship"
  - "cannot provide visa sponsorship"
  - "will not sponsor visas"
  - "must be authorized to work in the united states"
  - "must be authorised to work in the united kingdom"
  - "must have authorization to work in canada"
  - "eligible to work in the united states without sponsorship"
  - "eligible to work in canada without sponsorship"

exclude_titles:
  - "intern"
  - "internship"
  - "co-op"
  - "clearance required"
  - "TS/SCI"
